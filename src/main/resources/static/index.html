<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trendyolaz - Premium E-Ticarət</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-secondary: #12161f;
            --bg-card: rgba(22, 28, 38, 0.85);
            --accent-orange: #ff6b00;
            --accent-orange-hover: #e05d00;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(18, 22, 31, 0.9);
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-glow: 0 8px 32px 0 rgba(255, 107, 0, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- Header / Navbar --- */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
        }

        .navbar {
            max-width: 1300px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
            letter-spacing: -0.5px;
            cursor: pointer;
        }

        .logo i {
            color: var(--accent-orange);
            font-size: 28px;
        }

        .search-bar {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 12px 20px 12px 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-bar input:focus {
            border-color: var(--accent-orange);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(255, 107, 0, 0.2);
        }

        .search-bar i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent-orange);
            transform: translateY(-2px);
        }

        .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--accent-orange);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-primary);
        }

        .auth-btn {
            background: linear-gradient(135deg, var(--accent-orange), #ff8800);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.3);
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 0, 0.4);
        }

        /* --- Hero Banner --- */
        .hero {
            max-width: 1300px;
            margin: 32px auto 0;
            padding: 0 24px;
        }

        .hero-card {
            background: linear-gradient(135deg, rgba(255, 107, 0, 0.15) 0%, rgba(18, 22, 31, 0.8) 100%);
            border: 1px solid rgba(255, 107, 0, 0.3);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
        }

        .hero-title {
            font-size: 38px;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff 0%, #d1d5db 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            color: var(--text-muted);
            font-size: 15px;
        }

        /* --- Categories Filter --- */
        .categories-container {
            max-width: 1300px;
            margin: 36px auto 0;
            padding: 0 24px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-pills {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .category-pill {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .category-pill:hover, .category-pill.active {
            background: var(--accent-orange);
            color: #fff;
            border-color: var(--accent-orange);
            box-shadow: var(--shadow-glow);
        }

        /* --- Products Grid --- */
        .products-container {
            max-width: 1300px;
            margin: 32px auto 60px;
            padding: 0 24px;
            flex: 1;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 107, 0, 0.4);
            box-shadow: var(--shadow-glow);
        }

        .fav-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .fav-btn.active, .fav-btn:hover {
            color: #ff3b30;
            background: rgba(255, 59, 48, 0.2);
            border-color: #ff3b30;
        }

        .product-img-wrapper {
            width: 100%;
            height: 200px;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #1a202c;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-img-wrapper img {
            transform: scale(1.05);
        }

        .product-category {
            font-size: 12px;
            color: var(--accent-orange);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .product-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
            line-height: 1.4;
            height: 38px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .product-price {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
        }

        .add-cart-btn {
            background: rgba(255, 107, 0, 0.15);
            color: var(--accent-orange);
            border: 1px solid var(--accent-orange);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .add-cart-btn:hover {
            background: var(--accent-orange);
            color: #fff;
        }

        /* --- Modals --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            padding: 32px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .modal-close {
            position: absolute;
            top: 20px; right: 20px;
            background: none; border: none;
            color: var(--text-muted);
            font-size: 20px; cursor: pointer;
        }

        .modal-close:hover { color: #fff; }

        .modal-title {
            font-size: 22px; font-weight: 800; margin-bottom: 20px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .cart-total {
            display: flex; justify-content: space-between;
            font-size: 18px; font-weight: 800; margin-top: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px;
        }

        .form-group input {
            width: 100%; padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            border-radius: 10px; color: #fff; outline: none;
        }

        .btn-full {
            width: 100%; padding: 12px;
            background: var(--accent-orange);
            border: none; border-radius: 12px;
            color: #fff; font-weight: 700; cursor: pointer; margin-top: 16px;
        }

        .error-msg {
            color: #ff3b30;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 24px; text-align: center; color: var(--text-muted); font-size: 14px;
        }
    </style>
</head>
<body>

<!-- Header -->
<header>
    <div class="navbar">
        <a onclick="showAllProducts()" class="logo">
            <i class="fa-solid fa-bolt"></i>
            <span>TRENDYOLAZ</span>
        </a>

        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Məhsul və ya brend axtarın..." onkeyup="filterProducts()">
        </div>

        <div class="nav-actions">
            <button class="icon-btn" onclick="toggleFavFilter()" title="Sevimli Məhsullar">
                <i class="fa-regular fa-heart" id="favHeaderIcon"></i>
                <span class="badge" id="favCount">0</span>
            </button>
            <button class="icon-btn" onclick="openModal('cartModal')" title="Səbət">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="badge" id="cartCount">0</span>
            </button>
            <button class="auth-btn" id="authBtn" onclick="openModal('authModal')">Daxil Ol</button>
        </div>
    </div>
</header>

<!-- Hero Banner -->
<section class="hero">
    <div class="hero-card">
        <h1 class="hero-title">Ən Son Texnologiya Və Premium Moda</h1>
        <p class="hero-subtitle">Eksklüziv endirimlər və Bakı daxili pulsuz çatdırılma ilə alış-veriş edin.</p>
    </div>
</section>

<!-- Categories Filter Bar -->
<section class="categories-container">
    <div class="section-title">
        <i class="fa-solid fa-layer-group" style="color: var(--accent-orange);"></i>
        <span>Kateqoriyalar</span>
    </div>
    <div class="category-pills" id="categoryList">
        <button class="category-pill active" onclick="selectCategory('ALL', this)">Bütün Məhsullar</button>
        <button class="category-pill" onclick="selectCategory('Geyim', this)">Geyim</button>
        <button class="category-pill" onclick="selectCategory('Elektronika', this)">Elektronika</button>
        <button class="category-pill" onclick="selectCategory('Aksesuar', this)">Aksesuar</button>
        <button class="category-pill" onclick="selectCategory('Ev və Yaşam', this)">Ev və Yaşam</button>
        <button class="category-pill" onclick="selectCategory('Gözəllik', this)">Gözəllik</button>
    </div>
</section>

<!-- Products Grid -->
<main class="products-container">
    <div class="products-grid" id="productsGrid"></div>
</main>

<!-- Cart Modal -->
<div class="modal-overlay" id="cartModal">
    <div class="modal-card">
        <button class="modal-close" onclick="closeModal('cartModal')"><i class="fa-solid fa-xmark"></i></button>
        <h2 class="modal-title"><i class="fa-solid fa-cart-shopping" style="color: var(--accent-orange);"></i> Səbətiniz</h2>
        <div id="cartItemsList">
            <p style="color: var(--text-muted); text-align: center; padding: 20px 0;">Səbətiniz boşdur.</p>
        </div>
        <div class="cart-total">
            <span>Cəmi:</span>
            <span id="cartTotalPrice">0.00 ₼</span>
        </div>
        <button class="btn-full" onclick="checkout()">Sifarişi Tamamla</button>
    </div>
</div>

<!-- Auth Modal -->
<div class="modal-overlay" id="authModal">
    <div class="modal-card">
        <button class="modal-close" onclick="closeModal('authModal')"><i class="fa-solid fa-xmark"></i></button>
        <h2 class="modal-title"><i class="fa-solid fa-user-lock" style="color: var(--accent-orange);"></i> Hesaba Giriş</h2>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>E-poçt / İstifadəçi adı / Telefon</label>
                <input type="text" id="loginUsername" placeholder="İstifadəçi adı və ya E-poçt" required>
            </div>
            <div class="form-group">
                <label>Şifrə</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <div id="loginErrorMsg" class="error-msg"></div>
            <button type="submit" class="btn-full" id="loginSubmitBtn">Daxil Ol</button>
        </form>
    </div>
</div>

<footer>
    <p>&copy; 2026 Trendyolaz Enterprise. Bütün hüquqlar qorunur.</p>
</footer>

<script>
    let allProducts = [];
    let favorites = new Set();
    let cart = [];
    let selectedCategoryName = 'ALL';
    let showFavoritesOnly = false;

    // Guaranteed Unique High-Resolution Image Mapping per item type
    const exactProductImageMap = {
        'köynək': 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=600&auto=format&fit=crop&q=80',
        't-shirt': 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=600&auto=format&fit=crop&q=80',
        'şalvar': 'https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=600&auto=format&fit=crop&q=80',
        'iphone': 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600&auto=format&fit=crop&q=80',
        'telefon': 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600&auto=format&fit=crop&q=80',
        'macbook': 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=600&auto=format&fit=crop&q=80',
        'noutbuk': 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=600&auto=format&fit=crop&q=80',
        'saat': 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&auto=format&fit=crop&q=80',
        'qulaqlıq': 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600&auto=format&fit=crop&q=80',
        'ayaqqabı': 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&auto=format&fit=crop&q=80',
        'çanta': 'https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600&auto=format&fit=crop&q=80',
        'krem': 'https://images.unsplash.com/photo-1556228720-195a672e8a03?w=600&auto=format&fit=crop&q=80',
        'parfum': 'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=600&auto=format&fit=crop&q=80',
        'ətir': 'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=600&auto=format&fit=crop&q=80',
        'lampa': 'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=600&auto=format&fit=crop&q=80',
        'kofe': 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=600&auto=format&fit=crop&q=80'
    };

    const defaultFallbackImage = 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=600&auto=format&fit=crop&q=80';

    // Catalog Base Items across 5 categories
    const catalogFallbackData = [
        { id: 101, name: "Klassik Qara Köynək", categoryName: "Geyim", price: 29.99, description: "100% Pambıq rahat gündəlik köynək.", imageUrl: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=600&auto=format&fit=crop&q=80" },
        { id: 102, name: "iPhone 15 Pro", categoryName: "Elektronika", price: 2399.00, description: "Titanium gövdə və A17 Pro çip dəstəyi.", imageUrl: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600&auto=format&fit=crop&q=80" },
        { id: 103, name: "Minimalist Qol Saatı", categoryName: "Aksesuar", price: 149.50, description: "Dəri kəmərli zərif lüks qol saatı.", imageUrl: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&auto=format&fit=crop&q=80" },
        { id: 104, name: "Ağıllı Masa Lampası", categoryName: "Ev və Yaşam", price: 85.00, description: "Masaüstü tənzimlənən LED işıqlandırma.", imageUrl: "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=600&auto=format&fit=crop&q=80" },
        { id: 105, name: "Fransız Parfumu 100ml", categoryName: "Gözəllik", price: 189.99, description: "Odunsu və dəniz breeze tərkibli parfum.", imageUrl: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=600&auto=format&fit=crop&q=80" },
        { id: 106, name: "Dəri Qadın Çantası", categoryName: "Aksesuar", price: 119.00, description: "Təbii dəri materiallı xüsusi dizayn çanta.", imageUrl: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600&auto=format&fit=crop&q=80" }
    ];

    document.addEventListener('DOMContentLoaded', () => {
        checkExistingToken();
        fetchProducts();
    });

    function checkExistingToken() {
        const token = localStorage.getItem('jwtToken');
        const savedUser = localStorage.getItem('username');
        if (token && savedUser) {
            const btn = document.getElementById('authBtn');
            btn.innerText = savedUser;
            btn.onclick = null;
        }
    }

    // REAL Spring Boot Authentication via AuthController (/api/v1/auth/login)
    async function handleLogin(e) {
        e.preventDefault();
        const usernameInput = document.getElementById('loginUsername').value;
        const passwordInput = document.getElementById('loginPassword').value;
        const errorEl = document.getElementById('loginErrorMsg');
        const submitBtn = document.getElementById('loginSubmitBtn');

        errorEl.style.display = 'none';
        submitBtn.innerText = 'Yoxlanılır...';

        try {
            const response = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    usernameOrEmailOrPhone: usernameInput,
                    password: passwordInput
                })
            });

            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(data.message || data.error || 'İstifadəçi adı və ya şifrə yanlışdır!');
            }

            // Save JWT Token
            if (data.token || data.jwt || data.accessToken) {
                localStorage.setItem('jwtToken', data.token || data.jwt || data.accessToken);
            }
            localStorage.setItem('username', usernameInput.split('@')[0]);

            const authBtn = document.getElementById('authBtn');
            authBtn.innerText = usernameInput.split('@')[0];
            authBtn.onclick = null;

            closeModal('authModal');
            alert('Uğurla daxil oldunuz!');
        } catch (err) {
            errorEl.innerText = err.message;
            errorEl.style.display = 'block';
        } finally {
            submitBtn.innerText = 'Daxil Ol';
        }
    }

    async function fetchProducts() {
        try {
            const res = await fetch('/api/v1/products/search?size=50');
            if (res.ok) {
                const data = (await res.json()).content;
                if (data && data.length > 0) {
                    allProducts = mergeCatalogData(data);
                } else {
                    allProducts = catalogFallbackData;
                }
            } else {
                allProducts = catalogFallbackData;
            }
        } catch (err) {
            allProducts = catalogFallbackData;
        }
        renderProducts(allProducts);
    }

    function mergeCatalogData(backendData) {
        let merged = [...backendData];
        const presentCats = new Set(backendData.map(p => (p.categoryName || p.category?.name || '').toLowerCase()));

        catalogFallbackData.forEach(item => {
            if (!presentCats.has(item.categoryName.toLowerCase())) {
                merged.push(item);
            }
        });
        return merged;
    }

    function getSafePrice(p) {
        let priceVal = p.discountedPrice ?? p.originalPrice ?? 0;
        let parsed = parseFloat(priceVal);
        return isNaN(parsed) ? 0.00 : parsed;
    }

    function getExactImage(p) {
        if (p.imageUrl && p.imageUrl.startsWith('http')) return p.imageUrl;

        const name = (p.name || '').toLowerCase();
        const cat = (p.categoryName || p.category?.name || '').toLowerCase();

        for (let key in exactProductImageMap) {
            if (name.includes(key)) {
                return exactProductImageMap[key];
            }
        }

        if (cat.includes('geyim')) return exactProductImageMap['köynək'];
        if (cat.includes('elektronika')) return exactProductImageMap['iphone'];
        if (cat.includes('aksesuar')) return exactProductImageMap['saat'];
        if (cat.includes('ev')) return exactProductImageMap['lampa'];
        if (cat.includes('gözəllik')) return exactProductImageMap['parfum'];

        return defaultFallbackImage;
    }

    function renderProducts(products) {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = '';

        let list = products;
        if (showFavoritesOnly) {
            list = list.filter(p => favorites.has(p.id));
        }

        if (list.length === 0) {
            grid.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 60px 0; color: var(--text-muted);">
                    <i class="fa-solid fa-box-open" style="font-size: 40px; margin-bottom: 12px;"></i>
                    <p>Bu kateqoriyada məhsul tapılmadı.</p>
                </div>`;
            return;
        }

        list.forEach(p => {
            const price = getSafePrice(p);
            const imgSrc = getExactImage(p);
            const isFav = favorites.has(p.id);
            const catName = p.categoryName || p.category?.name || 'MƏHSUL';

            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite(${p.id}, this)">
                    <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                </button>
                <div class="product-img-wrapper">
                    <img src="${imgSrc}" alt="${p.name}" loading="lazy">
                </div>
                <div class="product-category">${catName}</div>
                <div class="product-title">${p.name}</div>
                <div class="product-desc">${p.description || 'Keyfiyyətli zəmanətli məhsul.'}</div>
                <div class="product-footer">
                    <div class="product-price">${price.toFixed(2)} ₼</div>
                    <button class="add-cart-btn" onclick="addToCart(${p.id})">
                        <i class="fa-solid fa-cart-plus"></i> Səbətə At
                    </button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function selectCategory(catName, element) {
        showFavoritesOnly = false;
        document.querySelectorAll('.category-pill').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        selectedCategoryName = catName;
        filterProducts();
    }

    function filterProducts() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allProducts.filter(p => {
            const catName = (p.categoryName || p.category?.name || '').toString().toLowerCase();
            const matchesCategory = (selectedCategoryName === 'ALL') || catName.includes(selectedCategoryName.toLowerCase());
            const matchesSearch = p.name.toLowerCase().includes(query) || (p.description && p.description.toLowerCase().includes(query));
            return matchesCategory && matchesSearch;
        });
        renderProducts(filtered);
    }

    function toggleFavorite(id, btn) {
        if (favorites.has(id)) {
            favorites.delete(id);
        } else {
            favorites.add(id);
        }
        document.getElementById('favCount').innerText = favorites.size;
        renderProducts(allProducts);
    }

    function toggleFavFilter() {
        showFavoritesOnly = !showFavoritesOnly;
        document.getElementById('favHeaderIcon').style.color = showFavoritesOnly ? '#ff3b30' : 'inherit';
        renderProducts(allProducts);
    }

    function addToCart(id) {
        const product = allProducts.find(p => p.id === id);
        if (!product) return;

        const existing = cart.find(item => item.id === id);
        if (existing) {
            existing.qty++;
        } else {
            cart.push({ ...product, qty: 1 });
        }
        updateCartUI();
    }

    function updateCartUI() {
        const cartCount = cart.reduce((sum, i) => sum + i.qty, 0);
        document.getElementById('cartCount').innerText = cartCount;

        const list = document.getElementById('cartItemsList');
        if (cart.length === 0) {
            list.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 20px 0;">Səbətiniz boşdur.</p>`;
            document.getElementById('cartTotalPrice').innerText = '0.00 ₼';
            return;
        }

        let html = '';
        let total = 0;

        cart.forEach(item => {
            const price = getSafePrice(item);
            const sum = price * item.qty;
            total += sum;
            html += `
                <div class="cart-item">
                    <div>
                        <div style="font-weight: 700;">${item.name}</div>
                        <div style="font-size: 12px; color: var(--text-muted);">${price.toFixed(2)} ₼ x ${item.qty}</div>
                    </div>
                    <div style="font-weight: 800; color: var(--accent-orange);">${sum.toFixed(2)} ₼</div>
                </div>`;
        });

        list.innerHTML = html;
        document.getElementById('cartTotalPrice').innerText = `${total.toFixed(2)} ₼`;
    }

    function openModal(id) {
        document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    function checkout() {
        if (cart.length === 0) {
            alert('Səbətiniz boşdur!');
            return;
        }
        alert('Sifarişiniz uğurla qəbul olundu!');
        cart = [];
        updateCartUI();
        closeModal('cartModal');
    }

    function showAllProducts() {
        showFavoritesOnly = false;
        document.getElementById('searchInput').value = '';
        selectCategory('ALL', document.querySelector('.category-pill'));
    }
</script>
</body>
</html>
