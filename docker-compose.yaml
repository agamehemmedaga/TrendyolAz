services:
  trendyol-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trendyol_backend_app
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/trendyol_db

  db:
    image: postgres:16-alpine
    container_name: trendyol_db
    restart: always
    environment:
      POSTGRES_DB: trendyol_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: