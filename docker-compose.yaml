services:

  db:
    image: postgres:16-alpine
    container_name: trendyol_db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: trendyol_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trendyol_db"]
      interval: 5s
      timeout: 5s
      retries: 5