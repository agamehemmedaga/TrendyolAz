<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trendyolaz</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0b1120; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }

        /* Header */
        header { background-color: #0b1120; padding: 1.25rem 3rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; }
        .logo { font-size: 1.5rem; font-weight: 800; color: #ea580c; display: flex; align-items: center; gap: 0.5rem; letter-spacing: 0.5px; }
        .user-status { font-size: 0.95rem; color: #818cf8; display: flex; align-items: center; gap: 0.5rem; }
        .login-btn-head { background: #374151; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600; }

        /* Categories Bar */
        .categories-bar { display: flex; gap: 0.8rem; padding: 1rem 3rem; background-color: #0d1527; border-bottom: 1px solid #1f2937; overflow-x: auto; }
        .cat-btn { background-color: #1f2937; color: #9ca3af; border: 1px solid #374151; padding: 0.55rem 1.25rem; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.9rem; white-space: nowrap; transition: all 0.2s; }
        .cat-btn.active, .cat-btn:hover { background-color: #ea580c; color: white; border-color: #ea580c; }

        /* Container */
        .container { display: flex; padding: 2rem 3rem; gap: 2rem; width: 100%; max-width: 1600px; margin: 0 auto; flex: 1; }
        .products-grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; align-content: start; }

        /* Product Card */
        .product-card { background-color: #111827; border-radius: 12px; padding: 1.25rem; border: 1px solid #1f2937; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .badge { position: absolute; top: 1rem; right: 1rem; background-color: #064e3b; color: #34d399; font-size: 0.75rem; padding: 3px 10px; border-radius: 12px; font-weight: 600; z-index: 2; }
        .product-img-box { height: 150px; background-color: #0b1120; border-radius: 8px; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; }
        .product-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.35rem; color: #f3f4f6; }
        .product-desc { font-size: 0.85rem; color: #6b7280; margin-bottom: 1.25rem; line-height: 1.3; min-height: 2.6em; }
        .price-container { display: flex; align-items: baseline; gap: 0.6rem; margin-bottom: 1rem; }
        .current-price { font-size: 1.35rem; font-weight: 800; color: #22c55e; }
        .old-price { font-size: 0.9rem; color: #6b7280; text-decoration: line-through; }
        .add-btn { background-color: #ea580c; color: white; border: none; padding: 0.85rem; border-radius: 8px; cursor: pointer; font-weight: 700; width: 100%; font-size: 0.95rem; transition: background-color 0.2s; }
        .add-btn:hover { background-color: #c2410c; }

        /* Cart Panel */
        .cart-panel { width: 380px; background-color: #111827; border-radius: 12px; padding: 1.5rem; border: 1px solid #1f2937; display: flex; flex-direction: column; height: fit-content; position: sticky; top: 2rem; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .cart-title { font-size: 1.35rem; font-weight: 800; color: #f9fafb; }
        .cart-close { color: #6b7280; cursor: pointer; font-size: 1.25rem; }
        .cart-items { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; max-height: 380px; overflow-y: auto; }
        .cart-item { background-color: #0b1120; padding: 1rem 1.25rem; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #1f2937; }
        .cart-item-title { font-size: 0.95rem; font-weight: 700; color: #f3f4f6; margin-bottom: 0.35rem; }
        .cart-item-price { font-size: 0.9rem; color: #22c55e; font-weight: 700; }
        .remove-btn { background-color: #991b1b; color: #fecaca; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }

        .cart-footer { border-top: 1px solid #1f2937; padding-top: 1.5rem; }
        .cart-total { display: flex; justify-content: space-between; align-items: center; font-size: 1.2rem; font-weight: 800; margin-bottom: 1.25rem; }
        .checkout-btn { background-color: #22c55e; color: white; border: none; padding: 0.95rem; border-radius: 8px; cursor: pointer; font-weight: 700; width: 100%; font-size: 1rem; transition: background-color 0.2s; }
        .checkout-btn:hover { background-color: #16a34a; }

        /* Login Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: #111827; padding: 2rem; border-radius: 12px; width: 350px; border: 1px solid #374151; text-align: center; }
        .modal h2 { margin-bottom: 1rem; color: #f97316; }
        .modal input { width: 100%; padding: 0.75rem; margin-bottom: 1rem; border-radius: 6px; border: 1px solid #374151; background: #0b1120; color: white; }
        .modal button { width: 100%; padding: 0.75rem; background: #ea580c; color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="logo">⚡ TRENDYOLAZ</div>
    <div class="user-status" id="user-status-area">
        <button class="login-btn-head" onclick="openLoginModal()">Daxil Ol</button>
    </div>
</header>

<div class="categories-bar">
    <button class="cat-btn active" onclick="filterCategory('all', this)">Bütün Məhsullar (36)</button>
    <button class="cat-btn" onclick="filterCategory(1, this)">Elektronika</button>
    <button class="cat-btn" onclick="filterCategory(2, this)">Geyim</button>
    <button class="cat-btn" onclick="filterCategory(3, this)">Kosmetika</button>
    <button class="cat-btn" onclick="filterCategory(4, this)">Məişət Texnikası</button>
    <button class="cat-btn" onclick="filterCategory(5, this)">İdman</button>
    <button class="cat-btn" onclick="filterCategory(6, this)">Kitab & Dəftərxana</button>
</div>

<div class="container">
    <div class="products-grid" id="products-grid"></div>

    <div class="cart-panel">
        <div class="cart-header">
            <div class="cart-title">Səbəbiniz</div>
            <div class="cart-close">✕</div>
        </div>

        <div class="cart-items" id="cart-items"></div>

        <div class="cart-footer">
            <div class="cart-total">
                <span>Cəmi:</span>
                <span id="cart-total">0 AZN</span>
            </div>
            <button class="checkout-btn" onclick="submitOrder()">Sifarişi Təsdiqlə Və Ödə</button>
        </div>
    </div>
</div>

<!-- Login Modal -->
<div class="modal-overlay" id="loginModal">
    <div class="modal">
        <h2>Sistemə Daxil Olun</h2>
        <p style="font-size: 0.85rem; color: #9ca3af; margin-bottom: 1rem;">Səbətə məhsul əlavə etmək və ya sifariş vermək üçün daxil olmalısınız.</p>
        <input type="text" id="username" placeholder="İstifadəçi adı">
        <input type="password" id="password" placeholder="Şifrə">
        <button onclick="handleLogin()">Daxil Ol</button>
    </div>
</div>

<script>
    const allProducts = [
        { id: 1, categoryId: 1, name: 'MacBook Pro 16" M3 Max', price: 3900, oldPrice: 4200, icon: '💻', desc: 'Apple M3 Max, 36GB RAM, 1TB SSD storage.' },
        { id: 2, categoryId: 1, name: 'iPhone 15 Pro Max 256GB', price: 2650, oldPrice: 2799, icon: '📱', desc: 'Titan korpus, A17 Pro çip, 5x Optik Zoom.' },
        { id: 3, categoryId: 1, name: 'Sony WH-1000XM5', price: 590, oldPrice: 650, icon: '🎧', desc: 'Sənayenin əsas kənar küy boğma texnologiyası.' },
        { id: 4, categoryId: 1, name: 'Samsung Odyssey Neo G9', price: 2100, oldPrice: 2300, icon: '🖥️', desc: '49 inc 240Hz Kavisli Oyun Monitoru.' },
        { id: 5, categoryId: 1, name: 'PlayStation 5 Slim 1TB', price: 1150, oldPrice: 1250, icon: '🎮', badge: 'Stokda var', desc: 'Yeni incə korpus, Ultra HD Blu-ray disk ötürücülü.' },
        { id: 6, categoryId: 1, name: 'Apple Watch Ultra 2', price: 1550, oldPrice: 1650, icon: '⌚', badge: 'Stokda var', desc: 'Titan korpus, dəqiq GPS və 36 saat batareya ömrü.' },

        { id: 7, categoryId: 2, name: 'Dəri Pencək Premium', price: 180, oldPrice: 220, icon: '🧥', desc: '100% təbii dəri, klassik kəsim.' },
        { id: 8, categoryId: 2, name: 'Nike Air Force 1', price: 210, oldPrice: 250, icon: '👟', desc: 'Klassik ağ rəngli gündəlik idman ayaqqabısı.' },
        { id: 9, categoryId: 2, name: 'Klassik Kostyum', price: 350, oldPrice: 420, icon: '👔', desc: 'İtalyan parça, xüsusi tikilişli kostyum.' },
        { id: 10, categoryId: 2, name: 'Kashmir Sviter', price: 120, oldPrice: 150, icon: '👕', desc: 'Yumşaq və isti saxlayan təbii kaşmir.' },
        { id: 11, categoryId: 2, name: 'Qadın Dəri Çanta', price: 160, oldPrice: 190, icon: '👜', desc: 'Şık dizaynlı əl çantası.' },
        { id: 12, categoryId: 2, name: 'Klassik Günəş Eynəyi', price: 95, oldPrice: 130, icon: '🕶️', desc: 'UV400 qorumalı polyarizasiyalı eynək.' },

        { id: 13, categoryId: 3, name: 'Dior Sauvage Elixir', price: 280, oldPrice: 320, icon: '🧴', desc: 'Kişilər üçün konsentratlaşdırılmış ətir.' },
        { id: 14, categoryId: 3, name: 'Chanel N5 Eau de Parfum', price: 310, oldPrice: 350, icon: '✨', desc: 'Klassik qadın ətri 100ml.' },
        { id: 15, categoryId: 3, name: 'Advanced Night Repair Serum', price: 140, oldPrice: 175, icon: '🧪', desc: 'Dərini bərpa edən serum.' },
        { id: 16, categoryId: 3, name: 'Dyson Airwrap Multi-Styler', price: 1100, oldPrice: 1250, icon: '💇‍♀️', desc: 'Saç feni və formalaşdırıcı dəsti.' },
        { id: 17, categoryId: 3, name: 'Yves Saint Laurent Pomada', price: 65, oldPrice: 85, icon: '💄', desc: 'Mat bitişli mat pomada.' },
        { id: 18, categoryId: 3, name: 'LOccitane Əl və Bədən Kremi', price: 45, oldPrice: 60, icon: '🧼', desc: 'Qidalandırıcı şi yağı tərkibli krem.' },

        { id: 19, categoryId: 4, name: 'Dyson V15 Detect', price: 1350, oldPrice: 1500, icon: '🧹', desc: 'Lazer işıqlı Naqilsiz Tozsoran.' },
        { id: 20, categoryId: 4, name: 'DeLonghi Espresso Maşını', price: 890, oldPrice: 1050, icon: '☕', desc: 'Avtomatik qəhvə dəmləyən aparat.' },
        { id: 21, categoryId: 4, name: 'Smart Robot Tozsoran', price: 620, oldPrice: 750, icon: '🤖', desc: 'Mopping və xəritələmə funksiyası.' },
        { id: 22, categoryId: 4, name: 'Ortopedik Yataq Dəsti', price: 240, oldPrice: 300, icon: '🛏️', desc: 'Pambıq tərkibli ikiadamlıq dəst.' },
        { id: 23, categoryId: 4, name: 'Air Fryer XXL Ağıllı Fırın', price: 310, oldPrice: 380, icon: '🍟', desc: 'Yağsız bişirmə aparatı.' },
        { id: 24, categoryId: 4, name: 'Ambiyans Masa Lampası', price: 75, oldPrice: 95, icon: '💡', desc: 'Ağıllı sensorlu LED lampa.' },

        { id: 25, categoryId: 5, name: 'Adidas UEFA Futbol Topu', price: 85, oldPrice: 110, icon: '⚽', desc: 'Orijinal matç topu.' },
        { id: 26, categoryId: 5, name: 'Qaqış Zolağı Smart', price: 1250, oldPrice: 1450, icon: '🏃‍♂️', desc: 'Ev üçün qatlanan ağıllı qaçış zolağı.' },
        { id: 27, categoryId: 5, name: 'Hantel Dəsti 20KG', price: 110, oldPrice: 140, icon: '🏋️‍♂️', desc: 'Nizamlanan metal hantel çərçivəsi.' },
        { id: 28, categoryId: 5, name: 'Wilson Pro Staff Raket', price: 230, oldPrice: 280, icon: '🎾', desc: 'Peşəkar tennis raketi.' },
        { id: 29, categoryId: 5, name: 'Garmin Forerunner Saat', price: 680, oldPrice: 790, icon: '⌚', desc: 'İdmançılar üçün GPS saat.' },
        { id: 30, categoryId: 5, name: 'Yoga Mat Premium', price: 50, oldPrice: 70, icon: '🧘‍♀️', desc: 'Sürüşməyən rahat mat.' },

        { id: 31, categoryId: 6, name: 'Clean Code - Robert Martin', price: 45, oldPrice: 55, icon: '📘', desc: 'Proqramçılar üçün təmiz kod kitabı.' },
        { id: 32, categoryId: 6, name: 'Designing Data-Intensive App', price: 65, oldPrice: 80, icon: '📕', desc: 'Böyük miqyaslı sistemlər kitabı.' },
        { id: 33, categoryId: 6, name: 'Atomic Habits - James Clear', price: 25, oldPrice: 35, icon: '📙', desc: 'Vərdişlərin gücü kitabı.' },
        { id: 34, categoryId: 6, name: 'The Pragmatic Programmer', price: 50, oldPrice: 60, icon: '📗', desc: 'Yazılım mühəndisliyi bələdçisi.' },
        { id: 35, categoryId: 6, name: 'Elegent Qeyd Dəftəri Dəsti', price: 20, oldPrice: 30, icon: '📓', desc: 'Dəri cildli dəftər və qələm.' },
        { id: 36, categoryId: 6, name: 'Erqonomik Oxu Lampası', price: 35, oldPrice: 45, icon: '📖', desc: 'Gözü yormayan kitab lampası.' }
    ];

    let cart = [];
    let currentUser = localStorage.getItem('user') ? JSON.parse(localStorage.getItem('user')) : null;

    function checkAuthUI() {
        const area = document.getElementById('user-status-area');
        if (currentUser) {
            area.innerHTML = `👤 ${currentUser.username} | <a href="#" onclick="logout()" style="color:#ef4444; margin-left:8px;">Çıxış</a>`;
        } else {
            area.innerHTML = `<button class="login-btn-head" onclick="openLoginModal()">Daxil Ol</button>`;
        }
    }

    function openLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
    function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }

    async function handleLogin() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        if (!u) { alert('İstifadəçi adını daxil edin'); return; }

        try {
            // AuthController-ə sorğu ataraq həqiqi JWT Token almaq üçün:
            const response = await fetch('http://localhost:8080/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });

            if (response.ok) {
                const data = await response.json();
                currentUser = { username: u, token: data.token || data.accessToken };
                localStorage.setItem('user', JSON.stringify(currentUser));
                checkAuthUI();
                closeLoginModal();
            } else {
                // Test rejimi üçün token saxlanılır
                currentUser = { username: u, token: "mock-jwt-token" };
                localStorage.setItem('user', JSON.stringify(currentUser));
                checkAuthUI();
                closeLoginModal();
            }
        } catch (err) {
            currentUser = { username: u, token: "mock-jwt-token" };
            localStorage.setItem('user', JSON.stringify(currentUser));
            checkAuthUI();
            closeLoginModal();
        }
    }

    function logout() {
        localStorage.removeItem('user');
        currentUser = null;
        checkAuthUI();
    }

    function renderProducts(items) {
        const grid = document.getElementById('products-grid');
        grid.innerHTML = '';
        items.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                ${p.badge ? `<span class="badge">${p.badge}</span>` : ''}
                <div>
                    <div class="product-img-box">${p.icon}</div>
                    <div class="product-title">${p.name}</div>
                    <div class="product-desc">${p.desc}</div>
                </div>
                <div>
                    <div class="price-container">
                        <span class="current-price">${p.price} AZN</span>
                        <span class="old-price">${p.oldPrice} AZN</span>
                    </div>
                    <button class="add-btn" onclick="addToCart(${p.id}, '${p.name.replace(/'/g, "\\'")}', ${p.price})">Səbətə Əlavə Et</button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function filterCategory(catId, btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        if (catId === 'all') {
            renderProducts(allProducts);
        } else {
            renderProducts(allProducts.filter(p => p.categoryId === catId));
        }
    }

    function addToCart(id, name, price) {
        if (!currentUser) {
            openLoginModal();
            return;
        }
        const existing = cart.find(i => i.id === id);
        if (existing) {
            existing.quantity += 1;
        } else {
            cart.push({ id, name, price, quantity: 1 });
        }
        updateCart();
    }

    function removeFromCart(id) {
        cart = cart.filter(i => i.id !== id);
        updateCart();
    }

    function updateCart() {
        const container = document.getElementById('cart-items');
        const totalEl = document.getElementById('cart-total');
        container.innerHTML = '';

        let total = 0;
        cart.forEach(i => {
            total += i.price * i.quantity;
            const div = document.createElement('div');
            div.className = 'cart-item';
            div.innerHTML = `
                <div>
                    <div class="cart-item-title">${i.name} ${i.quantity > 1 ? '('+i.quantity+')' : ''}</div>
                    <div class="cart-item-price">${i.price * i.quantity} AZN</div>
                </div>
                <button class="remove-btn" onclick="removeFromCart(${i.id})">Sil</button>
            `;
            container.appendChild(div);
        });

        totalEl.innerText = `${total} AZN`;
    }

    // BACKEND DTO VƏ SPRING SECURITY TOKEN İLƏ İŞLƏYƏN DÜZGÜN FUNKSİYA
    async function submitOrder() {
        if (!currentUser) {
            openLoginModal();
            return;
        }

        if (cart.length === 0) {
            alert("Səbətiniz boşdur!");
            return;
        }

        const payload = {
            items: cart.map(i => ({
                productId: i.id,
                quantity: i.quantity
            }))
        };

        const token = currentUser.token || "";

        try {
            const response = await fetch('http://localhost:8080/api/v1/orders', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(payload)
            });

            if (response.ok || response.status === 200 || response.status === 201) {
                alert("Sifarişiniz PostgreSQL bazasına uğurla yazıldı!");
                cart = [];
                updateCart();
            } else {
                const errText = await response.text();
                alert("Sifariş xətası (Status " + response.status + "): " + errText);
            }
        } catch (err) {
            console.error(err);
            alert("Serverə bağlanmaq mümkün olmadı. Spring Boot-un 8080 portunda aktiv olduğundan və Controller-də @CrossOrigin olmasından əmin olun.");
        }
    }

    checkAuthUI();
    renderProducts(allProducts);
    updateCart();
</script>
</body>
</html>
